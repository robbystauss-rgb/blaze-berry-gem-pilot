name: Staging validation

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate canonical REC Mama Made assets
        run: npm run check:assets

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
