name: Staging validation

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canonical REC Mama Made assets
        run: npm run check:assets

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Save validated Vercel build output
        uses: actions/upload-artifact@v4
        with:
          name: rec-mama-made-staging-vercel-output
          path: .vercel/output
          if-no-files-found: error
          compression-level: 6
