name: Staging validation

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Persist reconciled lockfile on staging
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "REC Mama Made staging bot"
            git config user.email "actions@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Reconcile package lock for staging"
            git push origin HEAD:staging
          fi

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply canonical REC Mama Made source fixes
        run: npm run fix:rec-assets

      - name: Persist canonical source fixes on staging
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "REC Mama Made staging bot"
            git config user.email "actions@users.noreply.github.com"
            git add src public scripts package.json package-lock.json CORRECT_ASSETS.md 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Apply canonical REC Mama Made asset fixes"
              git push origin HEAD:staging
            fi
          fi

      - name: Validate canonical REC Mama Made assets
        run: npm run check:assets

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
